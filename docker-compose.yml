services:
    app:
        build: .
        image: laravel-test-app
        volumes:
            - .:/var/www/html
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy

    nginx:
        image: nginx:alpine
        ports:
            - "${APP_PORT:-8000}:80"
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    pgsql:
        image: postgres:18-alpine
        environment:
            POSTGRES_DB: ${DB_DATABASE:-laravel_test}
            POSTGRES_USER: ${DB_USERNAME:-laravel}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - "${FORWARD_DB_PORT:-5434}:5432"
        volumes:
            - pgsql-data:/var/lib/postgresql
        healthcheck:
            test:
                [
                    "CMD",
                    "pg_isready",
                    "-q",
                    "-d",
                    "${DB_DATABASE:-laravel_test}",
                    "-U",
                    "${DB_USERNAME:-laravel}",
                ]
            interval: 5s
            timeout: 5s
            retries: 20

    redis:
        image: redis:8-alpine
        ports:
            - "${FORWARD_REDIS_PORT:-6379}:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 20

    adminer:
        image: adminer:latest
        environment:
            ADMINER_DEFAULT_SERVER: pgsql
        ports:
            - "${FORWARD_ADMINER_PORT:-8080}:8080"
        depends_on:
            pgsql:
                condition: service_healthy

volumes:
    pgsql-data:
    redis-data:
